[project]
name = "fanfou-mcp-box"
version = "0.1.0"
description = "Fanfou MCP server (stdio), https transport + http-signed OAuth1"
requires-python = ">=3.12"
dependencies = ["mcp>=1.2,<2", "redis>=5,<6"]

[tool.vercel]
# Remote Streamable HTTP server (stdio entry is server.py; don't let Vercel guess)
entrypoint = "http_app:app"
